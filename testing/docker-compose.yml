# Docker Compose for kerbsec integration testing
#
# This sets up a MIT Kerberos KDC for testing GSS-API operations.
#
# Usage:
#   docker-compose -f testing/docker-compose.yml up -d
#   cargo test --features integration-tests
#   docker-compose -f testing/docker-compose.yml down
#
# Or use the test script:
#   ./testing/scripts/run-integration-tests.sh

services:
  kdc:
    build:
      context: ./kdc
      dockerfile: Dockerfile
    container_name: kerbsec-test-kdc
    hostname: kdc.test.kerbsec.local
    domainname: test.kerbsec.local
    environment:
      - KRB5_REALM=TEST.KERBSEC.LOCAL
      - KRB5_KDC=kdc.test.kerbsec.local
      - KRB5_ADMIN_SERVER=kdc.test.kerbsec.local
    volumes:
      - krb5-data:/var/lib/krb5kdc
      - ./kdc/krb5.conf:/etc/krb5.conf:ro
      - ./kdc/kdc.conf:/etc/krb5kdc/kdc.conf:ro
      - keytabs:/keytabs
    ports:
      # Kerberos ports
      - "8888:88/tcp"      # KDC
      - "8888:88/udp"      # KDC
      - "8749:749/tcp"     # kadmin
      - "8749:749/udp"     # kadmin
    networks:
      kerberos:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD", "kadmin.local", "-q", "listprincs"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Service host for testing service tickets
  service-host:
    build:
      context: ./kdc
      dockerfile: Dockerfile.client
    container_name: kerbsec-test-service
    hostname: service.test.kerbsec.local
    domainname: test.kerbsec.local
    environment:
      - KRB5_REALM=TEST.KERBSEC.LOCAL
      - KRB5_KDC=kdc.test.kerbsec.local
    volumes:
      - ./kdc/krb5.conf:/etc/krb5.conf:ro
      - keytabs:/keytabs:ro
    networks:
      kerberos:
        ipv4_address: 172.28.0.20
    depends_on:
      kdc:
        condition: service_healthy

networks:
  kerberos:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  krb5-data:
  keytabs:
