# Kerberos configuration for kerbsec integration testing
#
# This configuration is used by both the KDC container and test clients.
# Copy to /etc/krb5.conf or set KRB5_CONFIG environment variable.

[libdefaults]
    default_realm = TEST.KERBSEC.LOCAL
    dns_lookup_realm = false
    dns_lookup_kdc = false
    ticket_lifetime = 24h
    renew_lifetime = 7d
    forwardable = true
    proxiable = true

    # Use strong crypto by default (AES-256)
    default_tgs_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96
    default_tkt_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96
    permitted_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96

    # Allow weak crypto for compatibility testing (disabled by default)
    # allow_weak_crypto = true

    # Clock skew tolerance (5 minutes, same as AD default)
    clockskew = 300

    # Disable reverse DNS for testing
    rdns = false

[realms]
    TEST.KERBSEC.LOCAL = {
        kdc = kdc.test.kerbsec.local:88
        admin_server = kdc.test.kerbsec.local:749
        default_domain = test.kerbsec.local
    }

[domain_realm]
    .test.kerbsec.local = TEST.KERBSEC.LOCAL
    test.kerbsec.local = TEST.KERBSEC.LOCAL
    # Allow localhost for testing
    localhost = TEST.KERBSEC.LOCAL
    127.0.0.1 = TEST.KERBSEC.LOCAL

[logging]
    kdc = FILE:/var/log/krb5kdc.log
    admin_server = FILE:/var/log/kadmin.log
    default = FILE:/var/log/krb5lib.log

[appdefaults]
    pam = {
        debug = false
        ticket_lifetime = 36000
        renew_lifetime = 36000
        forwardable = true
    }
