name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # Building needs no Kerberos packages: GSS-API is loaded at run time.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # With dns on (as in --all-features), clippy misses some lints in the
      # credential caches, such as or_fun_call on their errors.
      - name: Run clippy (credential caches without dns)
        run: cargo clippy --all-targets --features ccache,ccache-kcm,ccache-keyring -- -D warnings

  test:
    name: Test
    strategy:
      matrix:
        rust: [stable, beta]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the GSS-API library (run time only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgssapi-krb5-2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Build
        run: cargo build --all-features --verbose

      - name: Run tests
        run: cargo test --all-features --verbose

      - name: Doc tests
        run: cargo test --doc --all-features

  test-trace:
    name: Test with Trace Logging
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the GSS-API library (run time only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgssapi-krb5-2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build with trace feature
        run: cargo build --features trace,dns,runtime,iov --verbose

      - name: Run tests with trace logging enabled
        env:
          RUST_LOG: kerbsec=trace
        run: cargo test --features trace,dns,runtime,iov --verbose

      - name: Run example with trace logging
        env:
          RUST_LOG: kerbsec::ctx=info,kerbsec::gss=debug,kerbsec::iov=trace
        run: cargo run --example wmi_client --features trace,dns,runtime --no-default-features || true

  # macOS: tests against Apple's GSS.framework (Heimdal-derived), which uses the
  # single-token gss_wrap/gss_unwrap path, then runs the real handshake against a
  # throwaway MIT KDC from Homebrew. kerbsec loads GSS.framework, never Homebrew's
  # MIT library.
  macos:
    name: macOS (Apple GSS.framework)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # Intel Macs: Apple packs the GSS structs there (see src/ffi)
          targets: x86_64-apple-darwin

      - name: Install MIT Kerberos (KDC and kinit for the e2e tests)
        run: brew list krb5 >/dev/null 2>&1 || brew install krb5

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The struct layout assertions in src/ffi are checked at compile time.
      - name: Clippy (Intel Mac)
        run: cargo clippy --all-targets --all-features --target x86_64-apple-darwin -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Run end-to-end tests
        run: ./scripts/e2e-kdc.sh

      - name: Run end-to-end tests (Intel Mac, under Rosetta)
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            KERBSEC_E2E_CARGO_FLAGS="--all-features --target x86_64-apple-darwin" ./scripts/e2e-kdc.sh
          else
            echo "Rosetta is not available on this runner; skipping the Intel run"
          fi

      - name: Point bindgen at the active SDK (ABI check)
        # libgssapi-sys hard-codes the Command Line Tools SDK path for <GSS/GSS.h>.
        # Set the per-target variable: bindgen prefers it over the generic one, and
        # abi-check/.cargo/config.toml would otherwise fill it with the Command Line
        # Tools SDK.
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p' | tr - _)"
          echo "BINDGEN_EXTRA_CLANG_ARGS_${target}=-F$(xcrun --show-sdk-path)/System/Library/Frameworks" >> "$GITHUB_ENV"

      - name: ABI check against Apple's headers
        working-directory: abi-check
        env:
          LIBGSSAPI_IMPL: apple
        run: cargo test

  # The hand-written declarations against MIT's headers, through bindgen. This is the
  # only place bindgen and the Kerberos headers are needed.
  abi-check:
    name: ABI check (MIT headers)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the GSS-API headers and libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compare constants and struct layouts
        working-directory: abi-check
        run: cargo test

  # End-to-end tests: real 3-leg handshake against a throwaway MIT KDC
  e2e:
    name: End-to-end (MIT KDC)
    runs-on: ubuntu-26.04
    needs: [clippy, test]  # Only run after lint and unit tests pass

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Kerberos dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y krb5-kdc krb5-admin-server krb5-user

      - name: Run end-to-end tests
        run: ./scripts/e2e-kdc.sh

  # Supply-chain checks (blocking)
  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # Advisories, licenses, sources and the ban on crates that compile C (deny.toml)
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
